name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install "numpy>=2.0,<3.0" "pandas>=2.2,<3.0"
          python -m pip install "torch>=2.8,<3.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "fastapi[standard]>=0.116,<0.117"
          python -m pip install --no-deps --editable .
      - name: Build C++ backend
        run: make cpp
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: resolveai --help
